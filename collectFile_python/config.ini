[Directory]
# 待处理的学生答卷所在目录
source_dir = E:\3陈忱\1协和学院\协和学院教学\考试\2024-2025下\Java程序设计\学生答卷
# 包含所有学生学号的文本文件路径
student_id_list_file = data\3.txt
# 收集后的文件存放的输出文件夹名称
output_dir_name = output
# 转换后的PDF存放的输出文件夹名称
pdf_dir_name = pdf

[FileRules]
# 需要保留和收集的目标文件扩展名（多个用斜杠分隔，如 .docx/.pdf）
target_extensions = .docx
# 学号的固定前缀（用于从文件名中准确提取学号）
student_id_prefix = 124

[Tasks]
# 是否启用差量拷贝（开启后不清理输出目录，仅当源文件更新或不存在时才拷贝，大幅节省大文件或开启PDF时的转换时间）
incremental_copy = True
# 自动刷新间隔（秒）。大于0表示持续监控并刷新最新提交情况（监控模式下跳过拷贝/PDF转换）；设为0表示正常执行并完成拷贝。
refresh_interval = 30
# 是否检查：同一个子文件夹下混杂了不同学号的文件
check_mixed_ids = True
# 是否检查：同一个子文件夹下有多个相同学号的文件
check_duplicate_ids = True
# 是否删除：不符合 target_extensions 扩展名的无关文件
delete_unmatched_files = False
# 是否将收集到的 .docx 文件转换为 PDF
enable_pdf_conversion = False